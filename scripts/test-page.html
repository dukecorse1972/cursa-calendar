
    <!DOCTYPE html>
    <html>
      <head>
        <meta charset="utf-8">
        <title>Google Calendar</title>
        <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
        <style>
          :root {
            --gcal-background: #ffffff;
            --gcal-surface: #ffffff;
            --gcal-surface-hover: #f1f3f4;
            --gcal-border: #dadce0;
            --gcal-text: #1f1f1f;
            --gcal-secondary-text: #5f6368;
            --gcal-accent: #1a73e8;
          }
          body {
            margin: 0;
            padding: 0;
            font-family: 'Google Sans', Roboto, sans-serif;
            background: #ffffff;
            color: #1f1f1f;
            overflow: hidden;
          }
          #top-mock-header {
            height: 64px;
            border-bottom: 1px solid #dadce0;
            display: flex;
            align-items: center;
            padding: 0 24px;
            gap: 16px;
          }
          #mock-content {
            width: 100vw;
            height: calc(100vh - 64px);
            position: relative;
          }
        </style>
      </head>
      <body>
        <div id="top-mock-header">
          <div style="font-size: 20px; font-weight: 500; display: flex; align-items: center; gap: 8px;">
            <span style="font-size: 24px;">📅</span>
            <span id="cursa-brand-logo-trigger"><span class="cursa-brand-text-label">Calificaciones</span></span>
          </div>
        </div>
        <div id="mock-content"></div>
      </body>
    </html>
